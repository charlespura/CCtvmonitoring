<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="robots" content="noindex">
    <title>Sign in · CCTV Monitor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f8cff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16.75 12h3.63a1 1 0 0 1 .89 1.45l-1.5 3a1 1 0 0 1-.9.55h-1.66'/%3E%3Cpath d='M2 19h4l1-3'/%3E%3Cpath d='M7.38 4.18 3.24 6.6a1 1 0 0 0-.36 1.37l3.5 6a1 1 0 0 0 1.37.36l9.82-5.73a1 1 0 0 0 .36-1.37l-2.5-4.28a1 1 0 0 0-1.37-.36Z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script>
        try {
            const t = localStorage.getItem('cctv-theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { /* storage unavailable */ }
    </script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <span class="brand-mark">
            <svg class="icon" viewBox="0 0 24 24"><path d="M16.75 12h3.63a1 1 0 0 1 .89 1.45l-1.5 3a1 1 0 0 1-.9.55h-1.66"/><path d="M2 19h4l1-3"/><path d="M7.38 4.18 3.24 6.6a1 1 0 0 0-.36 1.37l3.5 6a1 1 0 0 0 1.37.36l9.82-5.73a1 1 0 0 0 .36-1.37l-2.5-4.28a1 1 0 0 0-1.37-.36Z"/></svg>
        </span>
        <h1>CCTV Monitor</h1>
        <p>Enter the dashboard password to view the camera.</p>

        <form id="login-form" novalidate>
            <label class="field">
                <span>Password</span>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
                    <button class="icon-btn" type="button" id="toggle-password" aria-label="Show password" aria-pressed="false">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </label>
            <p class="form-error" id="login-error" role="alert" hidden></p>
            <button class="btn btn--primary" type="submit" id="login-submit">Sign in</button>
        </form>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
